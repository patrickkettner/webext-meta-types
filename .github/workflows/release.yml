# Release Tagging Workflow
#
# Tags and creates a GitHub Release on every push to main:
#   - Default -> patch (this project ships type corrections, not features)
#   - [additive] commit tag -> minor
#   - [breaking] commit tag -> major
#
# Creates a Git tag and a GitHub Release populated with the structural summary notes.
#
# Safety Guarantees:
#   1. Explicit Token: Uses AUTOPILOT_TOKEN for pushing release commits and tags.
#   2. Recursion Guard: release.yml ignores commits prefixed with 'chore(release):' or tagged '[skip release]'.
#   3. Artifact Integrity: Re-verifies 'npm run build', 'npm run check:artifacts', and 'git diff --exit-code dist/'
#      prior to creating the release tag, ensuring stale artifacts cannot be released.

name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  tag-release:
    name: Tag and Publish GitHub Release
    runs-on: ubuntu-latest

    # Prevent recursive execution on commits generated by the release workflow itself
    if: "!contains(github.event.head_commit.message, 'chore(release):') && !contains(github.event.head_commit.message, '[skip release]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine release bump type
        id: determine_bump
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          # Default to patch. Minor and major are opt-in through commit-message tags,
          # which the upstream bump PRs carry in their squash-merge title.
          BUMP_TYPE="patch"
          if echo "$COMMIT_MSG" | grep -q "\[breaking\]"; then
            BUMP_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -q "\[additive\]"; then
            BUMP_TYPE="minor"
          fi

          echo "Detected bump type: $BUMP_TYPE"
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

          printf "%s\n" "$COMMIT_MSG" > release_notes.md

      - name: Validate Autopilot Token Secret
        if: steps.determine_bump.outputs.should_release == 'true'
        env:
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_TOKEN }}
        run: |
          if [ -z "$AUTOPILOT_TOKEN" ]; then
            echo "::error::Required secret 'AUTOPILOT_TOKEN' is missing. A GitHub App token or PAT with 'repo' and 'workflow' scopes is required to push release tags and trigger downstream workflows."
            exit 1
          fi

      - name: Setup Node.js 22 (Active LTS)
        if: steps.determine_bump.outputs.should_release == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.determine_bump.outputs.should_release == 'true'
        run: npm ci

      - name: Verify Artifact Integrity, Tag and Create GitHub Release
        if: steps.determine_bump.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOPILOT_TOKEN }}
        run: |
          BUMP_TYPE="${{ steps.determine_bump.outputs.bump_type }}"

          # Configure git identity and authenticated remote URL
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.AUTOPILOT_TOKEN }}@github.com/${{ github.repository }}.git"

          # 1. Bump package.json version
          NEW_VERSION=$(npm version "$BUMP_TYPE" --no-git-tag-version)
          echo "Preparing release for version: $NEW_VERSION"

          # 2. Re-verify artifact build and fresh compilation
          npm run build
          npm run check:artifacts
          git diff --exit-code dist/ || (
            echo "::error::dist/ was dirty during release packaging."
            exit 1
          )

          # 3. Commit version bump on main
          git add package.json package-lock.json dist/
          git commit -m "chore(release): $NEW_VERSION [skip ci]"
          git push origin main

          # 4. Create Git Tag and push
          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"

          # 5. Create GitHub Release
          gh release create "$NEW_VERSION" \
            --title "$NEW_VERSION" \
            --notes-file release_notes.md
